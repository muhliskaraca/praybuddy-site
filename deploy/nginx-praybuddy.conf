# Pray Buddy — nginx-Konfiguration für praybuddy.likafilm.com
#
# Zweck: Beseitigt die Duplikat-URLs, die in der Google Search Console als
# "Alternative Seite mit richtigem kanonischen Tag" gemeldet werden.
#
# Vorher (alle liefern 200, keine Weiterleitung):
#   http://praybuddy.likafilm.com/       → Duplikat
#   https://www.praybuddy.likafilm.com/  → Duplikat
#   https://praybuddy.likafilm.com/index.html → Duplikat
#
# Nachher: alle drei antworten mit 301 auf https://praybuddy.likafilm.com/

# 1) HTTP → HTTPS (beide Hostnamen)
server {
    listen 80;
    listen [::]:80;
    server_name praybuddy.likafilm.com www.praybuddy.likafilm.com;

    return 301 https://praybuddy.likafilm.com$request_uri;
}

# 2) www → ohne www (HTTPS)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.praybuddy.likafilm.com;

    # Zertifikatspfade an die bestehende Konfiguration anpassen:
    # ssl_certificate     /pfad/zum/fullchain.pem;
    # ssl_certificate_key /pfad/zum/privkey.pem;

    return 301 https://praybuddy.likafilm.com$request_uri;
}

# 3) Kanonischer Host
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name praybuddy.likafilm.com;

    root /var/www/praybuddy;   # an den tatsächlichen Pfad anpassen
    index index.html;

    # /index.html → / (verhindert die Duplikat-URL)
    location = /index.html {
        return 301 https://praybuddy.likafilm.com/;
    }
    location = /de/index.html {
        return 301 https://praybuddy.likafilm.com/de/;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Statische Assets dürfen lange gecacht werden.
    # Der Host liefert aktuell "Cache-Control: no-store" für alles –
    # das verschenkt Ladezeit ohne Gegenwert.
    location ~* \.(png|svg|jpg|jpeg|webp|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # HTML kurz cachen, damit Änderungen zügig ankommen
    location ~* \.html$ {
        expires 10m;
        add_header Cache-Control "public, max-age=600";
    }
}
